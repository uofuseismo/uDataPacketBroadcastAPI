edition = "2023";

package UDataPacketBroadcastAPI.V1;

import "uDataPacketBroadcastAPI/v1/packet.proto";
import "uDataPacketBroadcastAPI/v1/publish_response.proto";

/*!
 * Producers send packets to the front end.
 */
service ProxyFrontend {
    /*!
     * The producer sends its packets to this end point.
     * When finished returns of summary of packets sent.
     */
    rpc Publish(stream Packet) returns(PublishResponse) {};
}

edition = "2023";

package UDataPacketBroadcast.GRPC.V1;

imoprt "proto/v1/subscribe_to_all_streams_request.proto";
import "proto/v1/packet.proto";

/*!
 * Consumers receive packets from the proxy front end.
 */
service Backend {
    /*!
     * Lists the available streams.
     */
 
    /*! 
     * The consumer will receive data from all streams.
     */
    rpc SubscribeToAllStreams(SubscribeToAllStreamsRequest) returns{stream Packet) {}; 
}

